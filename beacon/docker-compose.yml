# ==========================================================================
# Hirebotics / Beacon — NOT part of upstream TypeORM.
# Postgres instance used to test the Beacon patches. See beacon/README.md.
#
# This is separate from the repo-root docker-compose.yml (upstream) on purpose:
#   - it uses the multi-arch `postgres:16-alpine` image so it runs natively on
#     Apple Silicon (the upstream postgis image is amd64-only), and
#   - it auto-creates the extensions our tests need (see beacon/initdb).
# ==========================================================================
name: beacon-typeorm

services:
  postgres:
    image: postgres:16-alpine
    container_name: beacon-typeorm-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 15
